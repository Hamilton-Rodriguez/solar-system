name: Solar System Workflow

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required to clone the repository

env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
    unit-testing:
        name: Unit Testing
        services:
          mongo-db:
            image: siddharth67/mongo-db:non-prod
            ports:
              - 27017:27017
        env:
            MONGO_URI: 'mongodb://localhost:27017/superData'
            MONGO_USERNAME: non-prod-user
            MONGO_PASSWORD: non-prod-password
        strategy:
            matrix:
                nodejs_version: [18, 20]
                operating_system: [ubuntu-latest]
                exclude:
                  - nodejs_version: 18
                    operating_system: macos-latest
        runs-on: ${{ matrix.operating_system }}
        steps:
        - name: Checkout Respository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version - ${{ matrix.nodejs_version }}
          uses: actions/setup-node@v3
          with:
            node-version: ${{ matrix.nodejs_version }}
        
        - name: Cache NPM dependencies
          uses: actions/cache@v4
          with:
            path: node_modules
            key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

        - name: Install Dependencies
          run: npm install
        
        - name: Unit Testing
          id: nodejs-unit-testing-step
          run: npm test

        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Results
            path: test-results.xml

    code-coverage:
        name: Code Coverage
        container:
          image: node:18
        services:
          mongo-db:
            image: siddharth67/mongo-db:non-prod
            options:
                --name mongo
            # ports:
            #   - 27017:27017
        env:
            MONGO_URI: 'mongodb://mongo:27017/superData'
            MONGO_USERNAME: non-prod-user
            MONGO_PASSWORD: non-prod-password
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Respository
          uses: actions/checkout@v4

        # - name: Setup NodeJS Version - 18
        #   uses: actions/setup-node@v3
        #   with:
        #     node-version: 18

        - name: Cache NPM dependencies
          uses: actions/cache@v4
          with:
            path: node_modules
            key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}        

        - name: Install Dependencies
          run: npm install
        
        - name: Check Code Coverage
          continue-on-error: true
          run: npm run coverage

        - name: Archive Test Result
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result
            path: coverage
            retention-days: 5

    docker:
      name: Containerization
      needs: [unit-testing, code-coverage]
      permissions:
        packages: write
      runs-on: ubuntu-latest
      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Dockerhub Login
        uses: docker/login-action@v2.2.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: GHCR Login
        uses: docker/login-action@v2.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build for Testing
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

      - name: Docker Image Testing
        run: |
          docker images
          docker run --name solar-system-app -d \
              -p 3000:3000 \
              -e MONGO_URI=$MONGO_URI \
              -e MONGO_USERNAME=$MONGO_USERNAME \
              -e MONGO_PASSWORD=$MONGO_PASSWORD \
              ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
          export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
          echo $IP

          echo Testing Image URL using wget
          wget -q -O - 127.0.0.1:3000/live | grep live

      - name: Workaround Lowercase the ghcr repository owner
        run: |
            echo "GHCR_OWNER_LC=${GHCR_OWNER,,}" >> ${GITHUB_ENV}
        env:
          GHCR_OWNER: '${{ github.repository_owner }}'

      - name: Container Registry Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
              ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
              ghcr.io/${{ env.GHCR_OWNER_LC }}/solar-system:${{ github.sha }}

    dev-deploy:
      if: github.event_name == 'pull_request'
      needs: docker
      uses: ./.github/workflows/reuse-deployment.yml
      secrets:
        mongodb-password: ${{ secrets.MONGO_PASSWORD }}
     

    dev-integration-test:
        name: Dev Integration Testing
        if: github.event_name == 'pull_request'
        needs: dev-deploy
        runs-on: ubuntu-latest
        steps:
          - name: Test URL Output using CURL and JQ
            env:
              URL: ${{ needs.dev-deploy.outputs.APP_INGRESS_URL }}
            run: |
              # Wait 15 seconds for Route 53 DNS & NGINX endpoints to settle
              sleep 15
              # Print raw output for debugging
              echo "Raw response from endpoint:"
              curl -s -k "https://$URL/live" || true
              echo ""
              # Retry up to 5 times (10s delay between attempts) to allow DNS/pod warm-up
              until curl -s -k "https://$URL/live" | jq -r .status | grep -iq "live"; do
                echo "Waiting for https://$URL/live to return status: live..."
                sleep 10
                ((count++))
                if [ "$count" -ge 5 ]; then
                  echo "Integration test timed out!"
                  exit 1
                fi
              done
              echo "SUCCESS: App is live!"


    prod-deploy:
      if: github.ref == 'refs/heads/main'
      needs: docker
      uses: ./.github/workflows/reuse-deployment.yml
      secrets:
        mongodb-password: ${{ secrets.MONGO_PASSWORD }}

    prod-integration-test:
        name: Prod Integration Testing
        if: github.ref == 'refs/heads/main'
        needs: prod-deploy
        runs-on: ubuntu-latest
        steps:
          - name: Test URL Output using CURL and JQ
            env:
              URL: ${{ needs.prod-deploy.outputs.APP_INGRESS_URL }}
            run: |
              # Wait 15 seconds for Route 53 DNS & NGINX endpoints to settle
              sleep 15
              # Print raw output for debugging
              echo "Raw response from endpoint:"
              curl -s -k "https://$URL/live" || true
              echo ""
              # Retry up to 5 times (10s delay between attempts) to allow DNS/pod warm-up
              until curl -s -k "https://$URL/live" | jq -r .status | grep -iq "live"; do
                echo "Waiting for https://$URL/live to return status: live..."
                sleep 10
                ((count++))
                if [ "$count" -ge 5 ]; then
                  echo "Integration test timed out!"
                  exit 1
                fi
              done
              echo "SUCCESS: App is live!"

